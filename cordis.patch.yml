# dsh bundle layer: mount the dsh-magpie plugin.
# Host half = package root export (./dsh/index.js, registers GET /magpie/quotas
# on the DSH web server). Browser half loads via the ./client export declared
# by the dsh.client manifest in package.json.
- insert:
    - id: dsh-magpie
      name: dsh-magpie
